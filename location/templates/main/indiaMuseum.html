  <!-- Floor Selection Modal -->
  <div id="floorSelectionModal" class="glassmorphism">
    <span id="floorSelectionClose">&times;</span>
    <div id="floorSelectionContent">
        <div id="floorSelectionInfo">
            <h2>Select Floor</h2>
            <button id="floorSelectionButtons" onclick="setCameraHeight(13)">Ground Floor</button>
            <button id="floorSelectionButtons" onclick="setCameraHeight(65)">First Floor</button>
            <button id="floorSelectionButtons" onclick="setCameraHeight(116)">Second Floor</button>
