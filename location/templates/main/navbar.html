{% load static %}
<link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
<style>
  * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    list-style: none;
    text-decoration: none;
    border: none;
    outline: none;
    scroll-behavior: smooth;
  }

  :root {
    --text-color: #fff;
    --bg-color: #ffffff;
    --main-color: #c80036;

    --h1-font: 6rem;
    --h2-font: 3rem;
    --p-font: 1.2rem;
  }

  header {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 50000;
    width: 100%;
    background: transparent;
    padding: 10px 17%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.5s ease;
  }

  .logo {
    font-size: 33px;
    color: var(--text-color);
    font-weight: 700px;
  }

  .logoSize {
    width: 20%;
    height: 20%;
    margin-left: -100px;
  }

  span {
    color: var(--main-color);
  }

  .navbar {
    display: flex;
  }

  .navbar a {
    color: var(--text-color);
    font-size: var(--p-font);
    font-weight: 500;
    margin: 15px 22px;
    transition: all 0.5s ease;
  }

  .navbar a:hover {
    color: var(--main-color);
  }
  .dropbtn {
    background: transparent;
    color: var(--text-color);
    margin: 0px 22px;
    /* padding: 16px; */
    /* font-size: 16px; */
    font-size: var(--p-font);
    font-weight: 500;
    border: none;
  }
  .dropdown {
    position: relative;
    display: inline-block;
  }

  /* Dropdown Content (Hidden by Default) */
  .dropdown-content {
    display: none;
    position: absolute;
    background-color: #f1f1f1;
    min-width: 120px;
    /* box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); */
    z-index: 1;
    border-radius: 4px;
  }

  /* Links inside the dropdown */
  .dropdown-content a {
    color: black;
    padding: 2px 2px;
    text-decoration: none;
    display: block;
  }

  /* Change color of dropdown links on hover */
  .dropdown-content a:hover {
    background-color: #ddd;
  }

  /* Show the dropdown menu on hover */
  .dropdown:hover .dropdown-content {
    display: block;
  }

  /* Change the background color of the dropdown button when the dropdown content is shown */
  .dropdown:hover .dropbtn {
    color: red;
  }

  .h-right {
    display: flex;
    align-items: center;
  }

  .h-right a:first-child {
    color: var(--text-color);
    font-size: var(--p-font);
    margin-right: 20px;
  }

  .h-right a {
    vertical-align: middle;
    font-size: 20px;
    color: var(--text-color);
    margin-right: 18px;
    margin-left: 5px;
    transition: all 0.5s ease;
  }

  .h-right a:hover {
    color: var(--main-color);
    transform: translateY(-3px);
  }

  #menu-icon {
    font-size: 30px;
    color: var(--text-color);
    cursor: pointer;
    z-index: 10001;
    display: none;
  }
  @media (max-width: 1200px){
    header{
        padding: 14px 5%;
    }
    header.sticky{
        padding: 7px 5%;
    }
    section{
        padding: 45px 5% 35px;
    }
    :root{
        --h1-font: 4.6rem;
        --h2-font: 2.8rem;
        --p-font: 15px;
    }
    .home{
        height: 90vh;
    }
}

@media (max-width: 1050px){
    .feature-content{
        gap: 1.5rem;
    }
    .content{
        gap: 3rem;
    }
    .Culture{
        gap: 3rem;
    }

    #menu-icon{
        display: block;
    }

    .navbar{
        position: absolute;
        width: 100%;
        height: 100vh;
        padding: 40px 60px;
        top: 0;
        bottom: 0;
        left: 100%;
        right: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg-color);
        transition: all .50s ease;
    }
    .navbar a{
        display: block;
        color: #979797;
        padding: 0;
        margin: 0px 0px 40px 0px;
        font-size: 2.2rem;
        font-weight: 400;
    }
    .navbar.open{
        left: 0;
    }
    .logoSize{
        width: 30%;
        height: 30%;
        margin-right:-50px;
        
    }
}

@media (max-width: 800px){
    .content{
        grid-template-columns: 1fr;
    }
    .Culture{
        grid-template-columns: 1fr;
    }
    .logoSize{
        width: 30%;
        height: 30%;
        margin-right:-50px;
    }
}

@media (max-width: 600px){
    :root{
        --h1-font: 3.5rem;
        --h2-font: 2.1rem;
    }
    .home{
        height: 85vh;
    }
    .logoSize{
        width: 30%;
        height: 30%;
        margin-right:-50px;
    }
}

@media (max-width: 450px){
    header{
        padding: 12px 3%;
    }
    header.sticky{
        padding: 7px 3%;
    }
    section{
        padding: 60px 5% 50px;
    }
    .logoSize{
        width: 30%;
        height: 30%;
        margin-right:-50px;
    }
}
</style>
<header style="background-color: black">
  <!-- <a href="#" class="logo"><span>e</span>Yantra</a> -->
  <img
    class="logoSize"
    src="{% static 'assets/landingImgs/logo.png' %}"
    alt=""
  />
  <ul class="navbar">
    <li><a href="{% url 'home'%}">Home</a></li>
    <li><a href="{% url 'indiaMap' %}">Map</a></li>
    <li style="display: flex; align-items: center; justify-content: center">
      <div class="dropdown">
        <button class="dropbtn">Edition</button>
        <div class="dropdown-content">
          <a href="{% url 'edition' 1 %}">Edition 1</a>
          <a href="{% url 'edition' 2 %}">Edition 2</a>
          <a href="{% url 'edition' 3 %}">Edition 3</a>
          <a href="{% url 'edition' 4 %}">Edition 4</a>
        </div>
      </div>
    </li>
    <li><a href="{% url 'quiz' %}">Quiz</a></li>
    {% if not user.is_authenticated %}
    <li><a href="{% url 'register' %}">Register</a></li>
    <li><a href="{% url 'login' %}">Login</a></li>
    {% endif%} 
    {% if user.is_authenticated%}
    <li><a href="{% url 'logout' %}">Logout</a></li>
    {% endif%}
  </ul>

  <div class="h-right">
    <a href="#">Follow us</a>
    <a href="#"><i class="ri-instagram-line"></i></a>
    <a href="#"><i class="ri-twitter-x-line"></i></a>
    <a href="#"><i class="ri-facebook-fill"></i></a>
    <div class="bx bx-menu" id="menu-icon"></div>
  </div>
</header>

<script>
  const header = document.querySelector('header');

window.addEventListener('scroll', () => {
  header.classList.toggle('sticky', window.scrollY > 60);
});

let menu = document.querySelector('#menu-icon');
let navbar = document.querySelector('.navbar');

menu.onclick = () => {
  menu.classList.toggle('bx-x');
  navbar.classList.toggle('open');
}
</script>
